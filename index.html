<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BLINK ARCHER: OVERDRIVE - KINETIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Space+Grotesk:wght@300;500;700&display=swap');

        :root {
            --neon-cyan: #00f2ff;
            --neon-pink: #ff00c8;
            --neon-purple: #9d00ff;
            --neon-green: #39ff14;
            --virus-red: #ff2d2d;
            --bg-dark: #020205;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden; touch-action: none;
            color: white;
        }

        .font-arcade { font-family: 'Russo One', sans-serif; text-transform: uppercase; letter-spacing: -0.02em; }

        #container {
            position: relative; width: 100vw; height: 100dvh;
            display: flex; justify-content: center; align-items: center;
            background: #000; overflow: hidden;
        }

        video, #game-canvas {
            position: absolute; top: 0; left: 0;
            width: 100% !important; height: 100% !important;
            transform: scaleX(-1); object-fit: cover;
        }

        .ui-screen {
            position: absolute; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,20,0.95) 100%);
        }

        .ui-screen.hidden { opacity: 0; pointer-events: none; transform: scale(1.1) translateY(30px); filter: blur(10px); }
        .ui-screen.visible { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); backdrop-filter: blur(25px); }

        .glass {
            background: rgba(5, 5, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255,255,255,0.03);
            border-radius: 2.5rem;
            backdrop-filter: blur(20px);
        }

        .neon-border-cyan { border: 1px solid var(--neon-cyan); box-shadow: 0 0 40px rgba(0, 242, 255, 0.2); }
        
        .btn-premium {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: black; font-weight: 900;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden;
        }
        .btn-premium:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 15px 45px rgba(0, 242, 255, 0.5); }
        .btn-premium:active { transform: translateY(1px) scale(0.97); }

        .timer-ring { width: clamp(80px, 10vh, 110px); height: clamp(80px, 10vh, 110px); transform: rotate(-90deg); }
        
        .scanline {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 242, 255, 0.05) 50%);
            background-size: 100% 4px;
            pointer-events: none; z-index: 10;
            animation: scan 10s linear infinite;
        }
        @keyframes scan { from { background-position: 0 0; } to { background-position: 0 100%; } }

        .hud-container {
            position: absolute; inset: 0; z-index: 85; pointer-events: none;
            opacity: 0; transition: opacity 0.5s ease;
        }

        .selector-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s ease;
            color: rgba(255,255,255,0.4);
        }
        .selector-btn.active {
            background: rgba(0, 242, 255, 0.2);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.3);
            color: white;
            transform: scale(1.05);
        }

        .loading-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .hit-flash {
            position: absolute; inset: 0; background: white; pointer-events: none;
            opacity: 0; z-index: 90;
        }

        .pulse-text { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="game-canvas"></canvas>
    <div id="flash-overlay" class="hit-flash"></div>
    <div class="scanline"></div>

    <!-- TRACKING ERROR UI -->
    <div id="tracking-lost-warning" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[95] opacity-0 transition-all duration-300 pointer-events-none scale-75">
        <div class="glass p-8 border-red-500/50 flex flex-col items-center text-center">
            <div class="w-16 h-16 border-4 border-red-500 border-t-transparent rounded-full animate-spin mb-4 shadow-[0_0_20px_red]"></div>
            <div class="font-arcade text-red-500 text-3xl tracking-widest">Signal Lost</div>
            <div class="text-[10px] uppercase font-bold text-white/40 mt-2 tracking-widest">Adjust Lighting / Position</div>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen" class="ui-screen visible">
        <div class="glass p-10 md:p-14 flex flex-col items-center w-[580px] max-w-[94vw] neon-border-cyan text-center">
            <div class="text-[11px] tracking-[0.7em] text-cyan-400 font-bold mb-4 uppercase opacity-80 pulse-text">Link Ready for Sync</div>
            <h1 class="font-arcade text-5xl md:text-7xl mb-10 italic tracking-tighter leading-[0.85] drop-shadow-[0_0_20px_rgba(0,242,255,0.3)]">Blink Archer<br><span class="text-pink-500 text-3xl md:text-5xl drop-shadow-[0_0_15px_rgba(236,72,153,0.6)]">Overdrive Kinetic</span></h1>
            
            <div class="w-full space-y-8 mb-12">
                <div class="grid grid-cols-2 gap-5">
                    <div class="space-y-3">
                        <label class="text-[10px] uppercase font-black text-white/30 tracking-widest block">Cycle Duration</label>
                        <div class="flex gap-2" id="time-selector">
                            <button class="flex-1 py-4 glass selector-btn text-[11px] font-arcade active" data-val="15">15s</button>
                            <button class="flex-1 py-4 glass selector-btn text-[11px] font-arcade" data-val="30">30s</button>
                            <button class="flex-1 py-4 glass selector-btn text-[11px] font-arcade" data-val="60">60s</button>
                        </div>
                    </div>
                    <div class="space-y-3">
                        <label class="text-[10px] uppercase font-black text-white/30 tracking-widest block">Capacitor</label>
                        <div class="flex gap-2" id="arrow-selector">
                            <button class="flex-1 py-4 glass selector-btn text-[11px] font-arcade" data-val="5">05</button>
                            <button class="flex-1 py-4 glass selector-btn text-[11px] font-arcade active" data-val="10">10</button>
                            <button class="flex-1 py-4 glass selector-btn text-[11px] font-arcade" data-val="20">20</button>
                        </div>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="text-[10px] uppercase font-black text-white/30 tracking-widest block">Simulated Threat</label>
                    <div class="grid grid-cols-2 gap-3" id="skin-selector">
                        <button class="py-5 glass selector-btn text-[11px] font-arcade active" data-val="standard">CORE [Neon]</button>
                        <button class="py-5 glass selector-btn text-[11px] font-arcade" data-val="bird">AVIS [Bio]</button>
                        <button class="py-5 glass selector-btn text-[11px] font-arcade" data-val="bat">NOX [Noct]</button>
                        <button class="py-5 glass selector-btn text-[11px] font-arcade" data-val="void">GALAXIA [Glitch]</button>
                    </div>
                </div>
            </div>

            <button id="start-btn" class="btn-premium w-full py-7 rounded-[2.5rem] font-arcade text-3xl tracking-tight disabled:opacity-30 disabled:cursor-not-allowed">
                CONNECTING...
            </button>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hud-container">
        <div class="absolute top-8 md:top-12 left-8 md:left-12 flex items-start gap-6">
            <div class="glass p-4 min-w-[150px] md:min-w-[180px] border-l-4 border-l-cyan-400">
                <div class="text-[9px] font-bold text-cyan-400 tracking-widest uppercase mb-0.5 opacity-80">Sync Score</div>
                <div id="score-text" class="font-arcade text-4xl md:text-6xl tabular-nums tracking-tighter text-white">0000</div>
                <div class="flex items-center gap-3 mt-3">
                    <div class="text-[8px] font-black text-pink-500 uppercase tracking-widest">Multiplier</div>
                    <div class="flex-1 h-2 bg-white/10 rounded-full overflow-hidden">
                        <div id="combo-fill" class="h-full bg-pink-500 shadow-[0_0_15px_rgba(255,0,200,0.8)] transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            
            <div class="relative flex items-center justify-center">
                <svg class="timer-ring">
                    <circle cx="50%" cy="50%" r="42%" stroke="rgba(255,255,255,0.05)" stroke-width="8" fill="rgba(0,0,0,0.3)" />
                    <circle id="timer-progress" cx="50%" cy="50%" r="42%" stroke="var(--neon-cyan)" stroke-width="8" fill="transparent" stroke-dasharray="264" stroke-dashoffset="0" stroke-linecap="round" />
                </svg>
                <div id="timer-text" class="absolute font-arcade text-2xl md:text-4xl text-center text-white drop-shadow-lg">15</div>
            </div>
        </div>

        <div id="arrow-display" class="absolute top-8 md:top-12 right-8 md:right-12 flex gap-3 items-center"></div>

        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center">
            <div id="blink-label" class="text-[9px] font-black text-cyan-400 tracking-[0.6em] uppercase mb-3 opacity-80 drop-shadow-md">Neural Impulse</div>
            <div class="w-56 md:w-72 h-3 glass overflow-hidden rounded-full p-1 border border-white/20">
                <div id="blink-progress" class="h-full bg-cyan-400 rounded-full transition-all duration-100 shadow-[0_0_20px_cyan]" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="ui-screen hidden overflow-y-auto">
        <div class="glass p-8 md:p-10 flex flex-col items-center w-[420px] max-w-[96vw] neon-border-cyan my-8 text-center">
            <div id="ai-callsign" class="text-[11px] font-black text-cyan-400 tracking-[0.5em] mb-2 uppercase opacity-80">Establishing Identity...</div>
            <div id="rank-tag" class="px-5 py-1.5 bg-pink-600 rounded-full text-[11px] font-black tracking-[0.4em] mb-6 uppercase shadow-[0_0_20px_rgba(219,39,119,0.5)]">Processing...</div>
            
            <div id="final-score-text" class="font-arcade text-6xl md:text-8xl text-white italic mb-8 drop-shadow-2xl">0000</div>
            
            <div class="grid grid-cols-2 gap-4 w-full mb-8">
                <div class="glass p-5 bg-white/[0.03]">
                    <div class="text-[8px] text-white/40 uppercase mb-1.5 font-black tracking-widest">Precision</div>
                    <div id="accuracy-stat" class="font-arcade text-2xl md:text-3xl text-cyan-400">0%</div>
                </div>
                <div class="glass p-5 bg-white/[0.03]">
                    <div class="text-[8px] text-white/40 uppercase mb-1.5 font-black tracking-widest">Peak Chain</div>
                    <div id="combo-stat" class="font-arcade text-2xl md:text-3xl text-pink-500">x0</div>
                </div>
            </div>

            <div id="ai-debrief-container" class="w-full mb-8 space-y-4">
                <div class="glass p-5 bg-black/50 border-cyan-400/30 relative overflow-hidden">
                    <div id="ai-debrief-text" class="text-[11px] leading-relaxed text-white/70 italic min-h-[40px] flex items-center justify-center font-medium">
                        Decompressing session logs...
                    </div>
                    <div id="ai-loading-indicator" class="absolute inset-0 loading-shimmer hidden"></div>
                </div>
                <div class="flex gap-3">
                    <button id="ai-debrief-btn" class="flex-1 py-3 glass text-[10px] font-black tracking-widest text-cyan-400 border-cyan-400/50 hover:bg-cyan-400/20 transition-all uppercase">Analyze Data</button>
                    <button id="ai-callsign-btn" class="flex-1 py-3 glass text-[10px] font-black tracking-widest text-pink-400 border-pink-400/50 hover:bg-pink-400/20 transition-all uppercase">Get Callsign</button>
                </div>
            </div>
            
            <button id="restart-btn" class="btn-premium w-full py-5 rounded-[1.8rem] font-arcade text-2xl mb-4">RE-SYNC CORE</button>
            <button id="menu-btn" class="w-full py-4 glass rounded-[1.5rem] text-[10px] font-black tracking-[0.3em] uppercase hover:bg-white/10 transition-colors opacity-60">Terminate Session</button>
        </div>
    </div>

    <div id="countdown" class="ui-screen hidden !bg-transparent">
        <div id="countdown-text" class="font-arcade text-[15rem] italic text-cyan-400 drop-shadow-[0_0_100px_rgba(0,242,255,0.7)] text-center scale-0 transition-transform duration-300">3</div>
    </div>
</div>

<script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    // --- UTILS & CONSTANTS ---
    const clamp = (num, min, max) => Math.min(Math.max(num, min), max);
    const lerp = (a, b, n) => (1 - n) * a + n * b;
    const apiKey = ""; 

    const COLORS = {
        cyan: '#00f2ff',
        pink: '#ff00c8',
        purple: '#9d00ff',
        white: '#ffffff',
        gold: '#FFD700',
        galagaBlue: '#1e40af',
        galagaYellow: '#fbbf24',
        galagaRed: '#ef4444'
    };

    // --- AUDIO SYSTEM ---
    class AudioManager {
        constructor() { this.ctx = null; this.masterGain = null; this.noiseBuffer = null; }
        async init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.connect(this.ctx.destination);
                this.masterGain.gain.value = 0.4;
                this._createNoiseBuffer();
            }
            if (this.ctx.state === 'suspended') await this.ctx.resume();
        }
        _createNoiseBuffer() {
            const bufferSize = this.ctx.sampleRate * 2;
            this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const output = this.noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        }
        play(type, freq, dur, vol, sweep = false) {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            if(sweep) osc.frequency.exponentialRampToValueAtTime(sweep, now + dur);
            g.gain.setValueAtTime(vol, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + dur);
            osc.connect(g); g.connect(this.masterGain);
            osc.start(); osc.stop(now + dur);
        }
        async noiseBurst(dur, vol, filterFreq = 1000) {
            if (!this.ctx || !this.noiseBuffer) return;
            const now = this.ctx.currentTime;
            const src = this.ctx.createBufferSource();
            src.buffer = this.noiseBuffer;
            const filter = this.ctx.createBiquadFilter();
            filter.frequency.setValueAtTime(filterFreq, now);
            const g = this.ctx.createGain();
            g.gain.setValueAtTime(vol, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + dur);
            src.connect(filter); filter.connect(g); g.connect(this.masterGain);
            src.start(); src.stop(now + dur);
        }
        async shoot() { 
            await this.init(); 
            this.play('square', 2800, 0.08, 0.2, 400); 
            this.play('sawtooth', 80, 0.2, 0.3, 10); 
            this.noiseBurst(0.1, 0.1, 3000);
        }
        async hit(skin) {
            await this.init();
            this.noiseBurst(0.3, 0.3, 500);
            switch(skin) {
                case 'void': this.play('sawtooth', 120, 0.4, 0.4, 20); break;
                case 'bird': this.play('sine', 1600, 0.2, 0.5, 400); break;
                case 'bat': this.play('sawtooth', 900, 0.2, 0.3, 100); break;
                default: this.play('sine', 1000, 0.1, 0.4, 200);
            }
        }
        async miss() { await this.init(); this.play('sawtooth', 100, 0.4, 0.15, 30); }
    }

    const Audio = new AudioManager();

    // --- GAME ENGINE ---
    let faceLandmarker, video = document.getElementById('video'), canvas = document.getElementById('game-canvas'), ctx = canvas.getContext('2d');
    
    let gameState = {
        mode: 'START', score: 0, arrows: 10, maxArrows: 10, time: 15, maxTime: 15,
        targetSkin: 'standard', combo: 1, maxCombo: 1, hits: 0, shots: 0,
        lastBlink: 0, lastTimestamp: 0, shake: 0, lastVideoTime: -1, 
        initialized: false, freeze: 0
    };

    let crosshair = { x: 0.5, y: 0.5, active: false, trail: [], blinkFlash: 0 };
    let target = { x: 0.5, y: 0.5, vx: 0, vy: 0, active: false, spawnTime: 0, lastFlap: 0, hitTime: 0, wobbleOffset: Math.random()*100, rot: 0 };
    let particles = [], popups = [], shockwaves = [];

    // --- GEMINI FUNCTIONS ---
    async function callGemini(prompt) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: { parts: [{ text: "You are the tactical AI commander. Speak in high-energy, concise, and futuristic terms." }] }
        };
        try {
            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text || "SYNC_ERROR";
        } catch (err) { return "LINK_ERROR"; }
    }

    async function generateDebrief() {
        const textEl = document.getElementById('ai-debrief-text');
        const loader = document.getElementById('ai-loading-indicator');
        const btn = document.getElementById('ai-debrief-btn');
        if (!textEl || !loader) return;
        btn.disabled = true; loader.classList.remove('hidden');
        const acc = gameState.shots > 0 ? Math.round((gameState.hits/gameState.shots)*100) : 0;
        const prompt = `Report on Archer performance: Score ${gameState.score}, Acc ${acc}%. One sentence combat log.`;
        textEl.innerText = await callGemini(prompt);
        loader.classList.add('hidden'); btn.disabled = false;
    }

    async function generateCallsign() {
        const signEl = document.getElementById('ai-callsign');
        const btn = document.getElementById('ai-callsign-btn');
        if (!signEl) return;
        btn.disabled = true; 
        const acc = gameState.shots > 0 ? Math.round((gameState.hits/gameState.shots)*100) : 0;
        const prompt = `Assign 2-word cyberpunk callsign for ${acc}% accuracy.`;
        const callsign = await callGemini(prompt);
        signEl.innerText = callsign.replace(/[".]/g, '').trim();
        btn.disabled = false;
    }

    // --- RENDERERS ---
    function createParticles(x, y, color, type = 'square') {
        const count = type === 'feather' ? 25 : 40;
        for (let i = 0; i < count; i++) {
            particles.push({
                x, y, vx: (Math.random() - 0.5) * 35, vy: (Math.random() - 0.5) * 35,
                life: 1.0, color, size: Math.random() * (type === 'feather' ? 20 : 12) + 4,
                type, rotation: Math.random() * Math.PI * 2, rv: (Math.random() - 0.5) * 0.5,
                gravity: type === 'feather' ? 0.2 : 0.4
            });
        }
    }

    function createShockwave(x, y, color) {
        shockwaves.push({ x, y, r: 0, life: 1.0, color, maxR: 150 });
    }

    function spawnTarget() {
        target.x = 0.2 + Math.random() * 0.6;
        target.y = 0.25 + Math.random() * 0.5;
        const isBio = gameState.targetSkin === 'bird' || gameState.targetSkin === 'bat';
        
        // Start slower (Manageable pace), scale aggressively with combo
        const baseSpeed = isBio ? 0.0006 : 0.0004; 
        const comboBonus = (gameState.combo - 1) * (isBio ? 0.0005 : 0.00025);
        const scoreBonus = (gameState.score / 8000) * 0.0004;
        
        const speed = baseSpeed + comboBonus + scoreBonus;
        
        const angle = Math.random() * Math.PI * 2;
        target.vx = Math.cos(angle) * speed;
        target.vy = Math.sin(angle) * speed;
        target.active = true;
        target.spawnTime = performance.now();
        target.hitTime = 0;
        target.wobbleOffset = Math.random() * 100;
        target.rot = 0;
    }

    function fire() {
        if (gameState.mode !== 'PLAYING' || gameState.arrows <= 0) return;
        gameState.shots++;
        gameState.arrows--;
        crosshair.blinkFlash = 1.0;
        Audio.shoot();
        const aspect = window.innerWidth / window.innerHeight;
        const dx = (crosshair.x - target.x) * aspect, dy = (crosshair.y - target.y);
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.12 && target.active) {
            gameState.hits++;
            const pts = 10 * gameState.combo;
            gameState.score += pts;
            gameState.freeze = 50;
            createShockwave(target.x, target.y, COLORS.cyan);
            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = '0.5'; setTimeout(() => flash.style.opacity = '0', 100);
            if (gameState.combo > 1) popups.push({ x: target.x, y: target.y - 0.1, text: `X${gameState.combo}`, color: COLORS.pink, life: 1.0, vy: -6, size: 60 });
            gameState.combo++;
            if(gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;
            target.hitTime = performance.now();
            Audio.hit(gameState.targetSkin);
            const pColor = gameState.targetSkin === 'bird' ? COLORS.white : COLORS.cyan;
            createParticles(target.x, target.y, pColor, gameState.targetSkin === 'bird' ? 'feather' : 'square');
            popups.push({ x: target.x, y: target.y, text: `+${pts}`, color: COLORS.white, life: 1.0, vy: -4, size: 45 });
            gameState.shake = 50; target.active = false;
            setTimeout(spawnTarget, 250);
        } else {
            gameState.combo = 1; Audio.miss();
            gameState.shake = 15;
            popups.push({ x: crosshair.x, y: crosshair.y, text: `MISFIRE`, color: COLORS.pink, life: 1.0, vy: -2, size: 38 });
            createParticles(crosshair.x, crosshair.y, COLORS.pink);
        }
        updateHUD();
        if (gameState.arrows === 0) setTimeout(endGame, 1000);
    }

    function updateHUD() {
        const container = document.getElementById('arrow-display');
        if (!container) return;
        container.innerHTML = '';
        const h = window.innerHeight;
        for(let i=0; i<gameState.maxArrows; i++) {
            const active = i < gameState.arrows;
            const height = clamp(h * 0.045, 35, 75);
            container.innerHTML += `<div class="w-3.5 rounded-full transition-all duration-300 ${active ? 'bg-cyan-400 shadow-[0_0_25px_rgba(0,242,255,0.9)]' : 'bg-white/10'}" style="height: ${height}px; transform: skewX(-15deg) ${!active ? 'scale(0.6)' : 'scale(1)'}"></div>`;
        }
    }

    async function init() {
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        try {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`, delegate: "GPU" },
                outputFaceBlendshapes: true, runningMode: "VIDEO", numFaces: 1
            });
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                document.getElementById('start-btn').disabled = false;
                document.getElementById('start-btn').innerText = "SYNC NEURAL CORE";
                gameState.initialized = true;
                requestAnimationFrame(gameLoop);
            };
        } catch (e) { document.getElementById('start-btn').innerText = "LINK BLOCKED"; }
    }

    function gameLoop(now) {
        if (!gameState.initialized) return;
        const delta = Math.min(now - gameState.lastTimestamp, 100);
        gameState.lastTimestamp = now;
        if (gameState.freeze > 0) { gameState.freeze -= delta; render(now); requestAnimationFrame(gameLoop); return; }

        if (faceLandmarker && video.readyState >= 2 && video.currentTime !== gameState.lastVideoTime) {
            gameState.lastVideoTime = video.currentTime;
            const result = faceLandmarker.detectForVideo(video, now);
            if (result && result.faceLandmarks?.[0]) {
                const nose = result.faceLandmarks[0][168];
                const vA = video.videoWidth / video.videoHeight, sA = window.innerWidth / window.innerHeight;
                let mx = nose.x, my = nose.y;
                
                if (vA > sA) {
                    const sw = video.videoWidth * (window.innerHeight / video.videoHeight);
                    mx = (nose.x * sw - (sw - window.innerWidth)/2) / window.innerWidth;
                } else {
                    const sh = video.videoHeight * (window.innerWidth / video.videoWidth);
                    my = (nose.y * sh - (sh - window.innerHeight)/2) / window.innerHeight;
                }
                
                crosshair.x = lerp(crosshair.x, mx, 0.45); crosshair.y = lerp(crosshair.y, my, 0.45);
                crosshair.active = true;
                crosshair.trail.push({x: crosshair.x, y: crosshair.y, life: 1.0});
                if(crosshair.trail.length > 15) crosshair.trail.shift();
                document.getElementById('tracking-lost-warning').classList.add('opacity-0', 'scale-75');
                
                if (result.faceBlendshapes?.[0]) {
                    const blink = (result.faceBlendshapes[0].categories.find(s=>s.categoryName==='eyeBlinkLeft').score + result.faceBlendshapes[0].categories.find(s=>s.categoryName==='eyeBlinkRight').score) / 2;
                    document.getElementById('blink-progress').style.width = (blink * 100) + "%";
                    if (blink > 0.48 && now - gameState.lastBlink > 350) { fire(); gameState.lastBlink = now; }
                }
            } else {
                crosshair.active = false;
                if (gameState.mode === 'PLAYING') document.getElementById('tracking-lost-warning').classList.remove('opacity-0', 'scale-75');
            }
        }

        if (gameState.mode === 'PLAYING') {
            gameState.time -= delta / 1000;
            if (gameState.time <= 0) endGame();
            if (target.active) {
                target.x += target.vx * delta; target.y += target.vy * delta;
                target.rot += 0.02;
                if (target.x < 0.1) { target.x = 0.1; target.vx = Math.abs(target.vx); }
                if (target.x > 0.9) { target.x = 0.9; target.vx = -Math.abs(target.vx); }
                if (target.y < 0.2) { target.y = 0.2; target.vy = Math.abs(target.vy); }
                if (target.y > 0.8) { target.y = 0.8; target.vy = -Math.abs(target.vy); }
            }
            document.getElementById('timer-text').innerText = Math.ceil(Math.max(0, gameState.time));
            document.getElementById('timer-progress').style.strokeDashoffset = 264 * (1 - (gameState.time/gameState.maxTime));
            document.getElementById('score-text').innerText = Math.round(gameState.score).toString().padStart(4, '0');
            document.getElementById('combo-fill').style.width = Math.min(100, (gameState.combo-1)*25) + "%";
        }
        render(now);
        requestAnimationFrame(gameLoop);
    }

    function render(now) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const w = canvas.width, h = canvas.height;
        if (gameState.shake > 0) { ctx.save(); ctx.translate((Math.random()-0.5)*gameState.shake, (Math.random()-0.5)*gameState.shake); gameState.shake *= 0.85; }
        
        shockwaves.forEach((sw, i) => { sw.r += 10; sw.life -= 0.05; if (sw.life <= 0) shockwaves.splice(i, 1); ctx.strokeStyle = sw.color; ctx.lineWidth = 8 * sw.life; ctx.globalAlpha = sw.life; ctx.beginPath(); ctx.arc(sw.x*w, sw.y*h, sw.r, 0, Math.PI*2); ctx.stroke(); });
        
        crosshair.trail.forEach((p, i) => { p.life -= 0.05; const alpha = (i / crosshair.trail.length) * 0.4; ctx.strokeStyle = `rgba(0, 242, 255, ${alpha})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x * w, p.y * h, 8 + (i*4), 0, Math.PI * 2); ctx.stroke(); });

        if (target.active && gameState.mode === 'PLAYING') {
            const entry = clamp((now - target.spawnTime) / 600, 0, 1);
            const facing = target.vx >= 0 ? 1 : -1;
            const isBird = gameState.targetSkin === 'bird';
            const isBat = gameState.targetSkin === 'bat';
            const isBio = isBird || isBat;
            const speedMag = Math.sqrt(target.vx*target.vx + target.vy*target.vy);
            const wobble = Math.sin(now/(isBio ? 80 : 150) + target.wobbleOffset);
            
            ctx.save(); 
            ctx.translate(target.x * w, target.y * h); 
            ctx.scale(entry * facing, entry);
            
            if (gameState.targetSkin === 'void') {
                const strobe = Math.floor(now / 80) % 2 === 0;
                const pY = Math.sin(now/40) * 12;
                ctx.fillStyle = strobe ? COLORS.galagaYellow : COLORS.galagaRed;
                ctx.fillRect(-35, -40+pY, 12, 18); ctx.fillRect(23, -40+pY, 12, 18);
                ctx.fillStyle = COLORS.galagaYellow; ctx.fillRect(-22, -30, 44, 15);
                ctx.fillStyle = "white"; ctx.fillRect(-10, -25, 6, 6); ctx.fillRect(4, -25, 6, 6);
                ctx.fillStyle = COLORS.galagaBlue; ctx.fillRect(-30, -15, 60, 25);
                ctx.fillStyle = COLORS.galagaRed; ctx.beginPath(); ctx.moveTo(-30, 10); ctx.lineTo(30, 10); ctx.lineTo(20, 30); ctx.lineTo(-20, 30); ctx.fill();
            } else if (isBio) {
                // BANKING PHYSICS: Target leans into horizontal movement
                const bank = target.vx * 160; 
                ctx.rotate(bank);

                const animFreq = speedMag * (isBat ? 22 : 18); 
                const cycle = (now * animFreq) % (Math.PI * 2);
                const flap = Math.sin(cycle) > 0 ? Math.pow(Math.sin(cycle), 0.6) : Math.sin(cycle);
                
                // --- PREMIUM WING RENDERING ---
                const drawWing = (side) => {
                    ctx.save();
                    ctx.scale(side, 1);
                    ctx.rotate(flap * 1.5);
                    
                    if (isBat) {
                        ctx.fillStyle = "#1a1033";
                        ctx.beginPath();
                        ctx.moveTo(0,0);
                        ctx.bezierCurveTo(40, -100, 100, -80, 140, 20); 
                        ctx.lineTo(100, 10); ctx.lineTo(70, 40); ctx.lineTo(40, 10); ctx.lineTo(20, 30);
                        ctx.closePath(); ctx.fill();
                        ctx.strokeStyle = COLORS.pink; ctx.lineWidth = 1; ctx.globalAlpha = 0.4; ctx.stroke();
                    } else {
                        // --- PREMIUM BIRD OVERHAUL: MULTI-LAYERED PLUMAGE ---
                        const featherColors = [COLORS.gold, "#FFB300", "#FF6F00"];
                        for(let f=0; f<4; f++) {
                            ctx.save();
                            ctx.rotate(f * 0.15 + (flap * 0.08));
                            ctx.fillStyle = featherColors[f % 3];
                            ctx.beginPath();
                            ctx.moveTo(0,0);
                            // Draw realistic tapering feathers
                            ctx.bezierCurveTo(60, -110 + f*10, 180 - f*30, -50, 60, 40);
                            ctx.fill();
                            // Shimmer highlights
                            ctx.strokeStyle = "rgba(255,255,255,0.5)";
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                            ctx.restore();
                        }
                    }
                    ctx.restore();
                };
                
                drawWing(1); drawWing(-1);
                
                // --- BIRD TAIL FAN ---
                if (isBird) {
                    ctx.save();
                    ctx.translate(-20, 12);
                    ctx.rotate(Math.PI + (flap * 0.25));
                    ctx.fillStyle = "#E65100";
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.lineTo(55, -35); ctx.lineTo(70, 0); ctx.lineTo(55, 35);
                    ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.stroke();
                    ctx.restore();
                }

                // --- AERODYNAMIC BODY ---
                const bodyGrd = ctx.createRadialGradient(0, -10, 5, 0, 0, 50);
                if(isBat) {
                    bodyGrd.addColorStop(0, "#4A148C"); bodyGrd.addColorStop(1, "#000000");
                } else {
                    bodyGrd.addColorStop(0, "#FFF59D"); bodyGrd.addColorStop(1, "#F57C00");
                }
                ctx.fillStyle = bodyGrd;
                ctx.beginPath(); 
                // More teardrop shaped body for the bird
                if(isBird) {
                    ctx.moveTo(40, -10);
                    ctx.bezierCurveTo(60, 0, 60, 40, 0, 40);
                    ctx.bezierCurveTo(-45, 40, -45, 0, -20, -10);
                    ctx.closePath();
                } else {
                    ctx.ellipse(0, 5, 42, 34, 0, 0, Math.PI*2);
                }
                ctx.fill();
                
                // --- HEAD & EYES ---
                ctx.save();
                ctx.translate(35, -12 + Math.sin(now/100)*7);
                ctx.fillStyle = isBat ? "#150d26" : "#FFF9C4";
                ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI*2); ctx.fill();
                
                if(isBat) { 
                    ctx.beginPath(); ctx.moveTo(-15, -15); ctx.lineTo(-25, -45); ctx.lineTo(0, -20); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(15, -15); ctx.lineTo(25, -45); ctx.lineTo(0, -20); ctx.fill();
                } else {
                    // Curved raptor beak
                    ctx.fillStyle = "#37474F";
                    ctx.beginPath(); ctx.moveTo(15, -5); ctx.bezierCurveTo(45, -5, 55, 15, 35, 25); ctx.lineTo(15, 10); ctx.fill();
                }

                const angle = Math.atan2(crosshair.y - target.y, (crosshair.x - target.x)*facing);
                ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(12 + Math.cos(angle)*6, -2 + Math.sin(angle)*6, 10, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = isBat ? COLORS.pink : "#000"; 
                ctx.beginPath(); ctx.arc(12 + Math.cos(angle)*10, -2 + Math.sin(angle)*10, 6, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            } else {
                const pulse = Math.sin(now / 150) * 10;
                ctx.strokeStyle = COLORS.cyan; ctx.lineWidth = 6; ctx.setLineDash([25, 20]);
                ctx.beginPath(); ctx.arc(0, 0, 50 + pulse, 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]); ctx.fillStyle = COLORS.pink; ctx.shadowBlur = 30; ctx.shadowColor = COLORS.pink;
                ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        particles.forEach((p, i) => { p.vx *= 0.95; p.vy *= 0.95; p.vy += p.gravity; p.x += p.vx / w; p.y += p.vy / h; p.life -= 0.015; if (p.life <= 0) particles.splice(i, 1); ctx.save(); ctx.translate(p.x * w, p.y * h); ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.rotate(p.rotation += p.rv); if (p.type === 'feather') { ctx.beginPath(); ctx.ellipse(0,0, p.size, p.size/4, 0, 0, Math.PI*2); ctx.fill(); } else { ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size); } ctx.restore(); });
        popups.forEach((p, i) => { p.y += p.vy/h; p.life -= 0.02; if(p.life <= 0) popups.splice(i,1); ctx.font=`italic 900 ${p.size}px Russo One`; ctx.fillStyle=p.color; ctx.globalAlpha=p.life; ctx.textAlign='center'; ctx.save(); ctx.translate(p.x*w, p.y*h); ctx.scale(-1, 1); ctx.shadowBlur = 10; ctx.shadowColor = p.color; ctx.fillText(p.text, 0, 0); ctx.restore(); });

        if (crosshair.active) {
            const cx = crosshair.x*w, cy = crosshair.y*h;
            if (crosshair.blinkFlash > 0) { ctx.strokeStyle = `rgba(255, 255, 255, ${crosshair.blinkFlash})`; ctx.lineWidth = 20 * crosshair.blinkFlash; ctx.beginPath(); ctx.arc(cx, cy, 60, 0, Math.PI*2); ctx.stroke(); crosshair.blinkFlash -= 0.08; }
            ctx.strokeStyle = COLORS.cyan; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.arc(cx, cy, 40, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx-60, cy); ctx.lineTo(cx-20, cy); ctx.moveTo(cx+60, cy); ctx.lineTo(cx+20, cy);
            ctx.moveTo(cx, cy-60); ctx.lineTo(cx, cy-20); ctx.moveTo(cx, cy+60); ctx.lineTo(cx, cy+20); ctx.stroke();
            ctx.fillStyle = COLORS.white; ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI * 2); ctx.fill();
        }
        if (gameState.shake > 0) ctx.restore();
        ctx.globalAlpha = 1;
    }

    async function startSequence() { await Audio.init(); document.getElementById('start-screen').classList.replace('visible', 'hidden'); document.getElementById('end-screen').classList.replace('visible', 'hidden'); const cd = document.getElementById('countdown'); const cdT = document.getElementById('countdown-text'); cd.classList.remove('hidden'); let count = 3; const tick = () => { cdT.style.transform = 'scale(0)'; setTimeout(() => { cdT.innerText = count === 0 ? "ENGAGE" : count; cdT.style.transform = 'scale(1)'; if (count < 0) { cd.classList.add('hidden'); startGame(); } else { count--; setTimeout(tick, 700); } }, 50); }; tick(); }
    function startGame() { gameState.mode = 'PLAYING'; gameState.score = 0; gameState.hits = 0; gameState.shots = 0; gameState.combo = 1; gameState.maxCombo = 1; gameState.maxTime = parseInt(document.querySelector('#time-selector .active').dataset.val); gameState.time = gameState.maxTime; gameState.maxArrows = parseInt(document.querySelector('#arrow-selector .active').dataset.val); gameState.arrows = gameState.maxArrows; gameState.targetSkin = document.querySelector('#skin-selector .active').dataset.val; document.getElementById('hud').style.opacity = '1'; spawnTarget(); updateHUD(); }
    function endGame() { gameState.mode = 'END'; document.getElementById('hud').style.opacity = '0'; document.getElementById('end-screen').classList.replace('hidden', 'visible'); document.getElementById('final-score-text').innerText = Math.round(gameState.score).toString().padStart(4, '0'); document.getElementById('accuracy-stat').innerText = (gameState.shots > 0 ? Math.round((gameState.hits/gameState.shots)*100) : 0) + "%"; document.getElementById('combo-stat').innerText = "x" + (gameState.maxCombo - 1); generateCallsign(); generateDebrief(); }

    document.querySelectorAll('.selector-btn').forEach(btn => { btn.onclick = () => { btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); Audio.init().then(() => Audio.play('sine', 1200, 0.05, 0.1)); }; });
    document.getElementById('start-btn').onclick = startSequence; document.getElementById('restart-btn').onclick = startSequence; document.getElementById('ai-debrief-btn').onclick = generateDebrief; document.getElementById('ai-callsign-btn').onclick = generateCallsign; document.getElementById('menu-btn').onclick = () => location.reload();
    init();
</script>
